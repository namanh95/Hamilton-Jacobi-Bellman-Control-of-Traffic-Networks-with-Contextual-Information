name: stochastic-hjb-pinn-pr-smoke-test

on:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib scipy torch
      - name: Apply numerical-stability patches
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('stochastic_hjb_pinn.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('np.trapz', 'np.trapezoid')
          old = '''        barrier = 0.02 * ((q1 / torch.clamp(1.0 - q1, min=1e-3)) ** 2 +\n                          (q2 / torch.clamp(1.0 - q2, min=1e-3)) ** 2)\n        return c.w1 * q1**2 + c.w2 * q2**2 + c.control_weight * u**2 + barrier'''
          new = '''        # Smooth congestion barrier. The original reciprocal barrier became\n        # numerically singular for LHS points close to jam density and\n        # dominated the SHJB residual before learning began.\n        barrier = 0.05 * (q1**4 + q2**4)\n        return c.w1 * q1**2 + c.w2 * q2**2 + c.control_weight * u**2 + barrier'''
          if old not in s:
              raise SystemExit('Expected stage-cost block was not found')
          s = s.replace(old, new)
          s = s.replace('validation_every: int = 100', 'validation_every: int = 25')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile script
        run: python -m py_compile stochastic_hjb_pinn.py
      - name: Run intermediate convergence test
        env:
          MPLBACKEND: Agg
        run: |
          python stochastic_hjb_pinn.py \
            --epochs 500 \
            --n-interior 2000 \
            --n-terminal 500 \
            --n-validation 500 \
            --n-test 1000 \
            --mc-paths 20 \
            --device cpu \
            --output validation_results
      - name: Check outputs
        run: |
          test -s validation_results/training_history.csv
          test -s validation_results/test_metrics.csv
          test -s validation_results/monte_carlo_trajectories.csv
          test -s validation_results/policy_summary.csv
          test -s validation_results/run_metadata.json
          test -s validation_results/figure_training_convergence.png
          test -s validation_results/figure_stochastic_accumulation.png
      - uses: actions/upload-artifact@v4
        with:
          name: stochastic-hjb-pinn-validation-results
          path: validation_results/
